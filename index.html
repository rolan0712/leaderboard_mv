<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Sport Standings</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Outfit:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #14181d;
        --card: #f5f5f5;
        --ink: #14181d;
        --lime: #b6e36b;
        --olive: #6f9a3f;
        --display: "Unbounded", "Arial Black", Impact, sans-serif;
        --body: "Outfit", "Segoe UI", Helvetica, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef0f4;
        font-family: var(--body);
        padding: 24px;
      }

      .poster {
        position: relative;
        width: 100%;
        max-width: 900px;
        aspect-ratio: 4 / 5;
        min-height: 1060px;
        overflow: hidden;
        padding: 100px 90px 0;
        color: #fff;
        background:
          radial-gradient(
            circle at 20% 15%,
            rgba(255, 255, 255, 0.05),
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 70%,
            rgba(255, 255, 255, 0.04),
            transparent 45%
          ),
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.015) 0 2px,
            transparent 2px 4px
          ),
          var(--bg);
      }

      /* chevron decorations */
      .chev {
        position: absolute;
        display: flex;
        pointer-events: none;
      }
      .chev span {
        width: 70px;
        height: 120px;
        background: var(--olive);
        clip-path: polygon(0 0, 35% 0, 100% 50%, 35% 100%, 0 100%, 65% 50%);
        margin-right: 8px;
      }
      .chev.tl {
        top: 30px;
        left: 10px;
        opacity: 0.35;
        transform: scaleX(-1);
      }
      .chev.br {
        bottom: 28px;
        right: -40px;
        opacity: 0.9;
      }
      .chev.br span {
        height: 100px;
        width: 62px;
        opacity: 0.85;
      }

      /* frame + corner crosses */
      .frame {
        position: absolute;
        inset: 55px 40px 55px 65px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        pointer-events: none;
      }
      .cross {
        position: absolute;
        width: 50px;
        height: 50px;
      }
      .cross::before,
      .cross::after {
        content: "";
        position: absolute;
        background: #fff;
      }
      .cross::before {
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
      }
      .cross::after {
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
      }
      .cross.a {
        top: 35px;
        left: 40px;
      }
      .cross.b {
        top: 35px;
        right: 15px;
      }
      .cross.c {
        bottom: 30px;
        left: 40px;
      }
      .cross.d {
        bottom: 30px;
        right: 15px;
      }

      /* heading */
      .content {
        position: relative;
        z-index: 1;
      }
      h1 {
        font-family: var(--display);
        font-weight: 900;
        font-size: clamp(54px, 9.5vw, 84px);
        line-height: 0.95;
        letter-spacing: -0.02em;
        text-align: center;
        text-transform: uppercase;
      }
      .season {
        margin-top: 28px;
        text-align: center;
        color: var(--lime);
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      /* table */
      .table {
        margin-top: 70px;
      }
      .head,
      .row {
        display: grid;
        grid-template-columns: 70px 90px 1fr 130px 150px;
        align-items: center;
      }
      .head {
        padding: 0 16px 0 14px;
        margin-bottom: 14px;
        font-family: var(--display);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .head .team {
        grid-column: 3;
      }
      .head .num {
        text-align: center;
      }

      .rows {
        list-style: none;
        display: grid;
        gap: 13px;
      }
      .row {
        height: 81px;
        padding: 0 16px 0 14px;
        background: var(--card);
        color: var(--ink);
        border-left: 14px solid var(--lime);
        padding-left: 0;
      }
      .rank {
        font-family: var(--display);
        font-weight: 700;
        font-size: 22px;
        text-align: center;
      }
      .logo {
        width: 62px;
        height: 62px;
        margin-left: 4px;
      }
      .name {
        font-size: 27px;
        font-weight: 300;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }
      .num {
        font-family: var(--display);
        font-weight: 700;
        font-size: 34px;
        text-align: center;
      }

      .handle {
        position: absolute;
        left: 98px;
        bottom: 100px;
        color: var(--lime);
        font-size: 23px;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        z-index: 1;
      }

      @media (max-width: 720px) {
        .poster {
          padding: 70px 36px 0;
          min-height: 900px;
        }
        .head,
        .row {
          grid-template-columns: 38px 56px 1fr 62px 72px;
        }
        .logo {
          width: 44px;
          height: 44px;
        }
        .name {
          font-size: 16px;
        }
        .num {
          font-size: 20px;
        }
        .rank {
          font-size: 16px;
        }
        .row {
          height: 64px;
        }
        .head {
          font-size: 8px;
        }
        .table {
          margin-top: 40px;
        }
        .handle {
          left: 50px;
          bottom: 70px;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <div class="chev tl">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="chev br">
        <span></span><span></span><span></span><span></span><span></span
        ><span></span>
      </div>
      <div class="frame"></div>
      <i class="cross a"></i><i class="cross b"></i><i class="cross c"></i
      ><i class="cross d"></i>

      <div class="content">
        <h1>E-Sport<br />Standings</h1>
        <p class="season">2035 Regular Season</p>

        <div class="table">
          <div class="head">
            <span class="team">Team</span>
            <span class="num">Total Kill</span>
            <span class="num">Total Point</span>
          </div>

          <ol class="rows">
            <li class="row">
              <span class="rank">1</span>
              <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
                <path
                  d="M32 4 56 14v22c0 12-10 20-24 24C18 56 8 48 8 36V14z"
                  fill="#0f2a33"
                  stroke="#2ec4d6"
                  stroke-width="3"
                />
                <circle cx="32" cy="30" r="11" fill="#2ec4d6" />
                <path d="M22 30h20" stroke="#0f2a33" stroke-width="3" />
              </svg>
              <span class="name">Northbridge</span>
              <span class="num">46</span>
              <span class="num">106</span>
            </li>
            <li class="row">
              <span class="rank">2</span>
              <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
                <path
                  d="M32 6 52 20 48 52 32 60 16 52 12 20z"
                  fill="#e8962b"
                  stroke="#7a4a12"
                  stroke-width="3"
                />
                <path
                  d="M32 14 42 24 40 40 32 46 24 40 22 24z"
                  fill="#cfd8e6"
                />
                <path
                  d="M10 14 24 30M54 14 40 30"
                  stroke="#cfd8e6"
                  stroke-width="4"
                />
              </svg>
              <span class="name">Riverford</span>
              <span class="num">41</span>
              <span class="num">105</span>
            </li>
            <li class="row">
              <span class="rank">3</span>
              <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
                <path
                  d="M10 40C10 20 20 8 32 8s22 12 22 32c0 10-6 18-22 18S10 50 10 40z"
                  fill="#e0a21a"
                  stroke="#6b0f0f"
                  stroke-width="3"
                />
                <path d="M14 12c6-8 30-8 36 0l-4 8H18z" fill="#c4161c" />
                <path d="M22 34h20v8H22z" fill="#14181d" />
              </svg>
              <span class="name">Westbrook</span>
              <span class="num">47</span>
              <span class="num">103</span>
            </li>
            <li class="row">
              <span class="rank">4</span>
              <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
                <path
                  d="M12 8c24 0 42 14 42 32 0 10-6 16-6 16L36 46 24 56 16 40z"
                  fill="#2d7fd4"
                  stroke="#0e3a6e"
                  stroke-width="3"
                />
                <path d="M16 40 28 38 36 46 22 50z" fill="#fff" />
                <path
                  d="M20 42l3-4 3 4 3-4 3 4"
                  stroke="#14181d"
                  stroke-width="2"
                  fill="none"
                />
              </svg>
              <span class="name">Northvale</span>
              <span class="num">39</span>
              <span class="num">99</span>
            </li>
            <li class="row">
              <span class="rank">5</span>
              <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
                <circle
                  cx="32"
                  cy="34"
                  r="22"
                  fill="#8fa3b4"
                  stroke="#c4601a"
                  stroke-width="3"
                />
                <circle cx="32" cy="34" r="13" fill="#1f3a5a" />
                <path
                  d="M20 8 28 22M44 8 36 22"
                  stroke="#5b6e80"
                  stroke-width="5"
                />
              </svg>
              <span class="name">Riverside</span>
              <span class="num">45</span>
              <span class="num">96</span>
            </li>
            <li class="row">
              <span class="rank">6</span>
              <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="16" cy="14" r="7" fill="#c75a12" />
                <circle cx="48" cy="14" r="7" fill="#c75a12" />
                <path
                  d="M10 26c0-12 10-18 22-18s22 6 22 18c0 18-8 32-22 32S10 44 10 26z"
                  fill="#d9691a"
                  stroke="#5a2406"
                  stroke-width="3"
                />
                <ellipse cx="32" cy="42" rx="11" ry="9" fill="#f0b27a" />
                <circle cx="24" cy="28" r="3" fill="#14181d" />
                <circle cx="40" cy="28" r="3" fill="#14181d" />
              </svg>
              <span class="name">Parklands</span>
              <span class="num">46</span>
              <span class="num">94</span>
            </li>
          </ol>
        </div>
      </div>

      <p class="handle">@reallygreatsite</p>
    </main>
  </body>
</html>
